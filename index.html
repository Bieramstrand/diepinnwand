<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#e7ede7;
    --board-dark:#d7e0d6;
    --card:#fffdf8;
    --ink:#2b2e29;
    --ink-soft:#5c625a;
    --teal:#3f6a63;
    --teal-dark:#2c4c47;
    --ochre:#c9803f;
    --ochre-soft:#f0dcc0;
    --sage:#6b8f71;
    --sage-soft:#dceadd;
    --pin:#c85a4a;
    --shadow: 0 10px 24px rgba(43,46,41,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Work Sans', sans-serif;
    background:
      radial-gradient(circle at 1px 1px, rgba(0,0,0,0.045) 1px, transparent 0) 0 0/22px 22px,
      var(--board);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:60px;
  }
  header{
    padding:max(28px, env(safe-area-inset-top)) 20px 18px;
    text-align:center;
  }
  .back-link{
    display:inline-block;
    font-family:'Work Sans', sans-serif;
    font-size:0.78rem;
    font-weight:600;
    color:var(--teal);
    text-decoration:none;
    margin-bottom:10px;
  }
  header h1{
    font-family:'Caveat', cursive;
    font-size:2.6rem;
    font-weight:700;
    margin:0;
    color:var(--teal-dark);
    transform:rotate(-1.5deg);
  }
  header p{
    margin:4px 0 0;
    font-size:0.85rem;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }
  .stats{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .stat{
    background:var(--card);
    border-radius:10px;
    padding:8px 16px;
    box-shadow: var(--shadow);
    font-family:'JetBrains Mono', monospace;
    font-size:0.75rem;
    color:var(--ink-soft);
  }
  .stat b{
    display:block;
    font-family:'Work Sans', sans-serif;
    font-size:1.3rem;
    color:var(--teal-dark);
    font-weight:700;
  }
  .toolbar{
    max-width:640px;
    margin:0 auto;
    padding:0 16px;
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:12px;
    padding:14px 12px;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:0.92rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    box-shadow: var(--shadow);
    transition:transform 0.12s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-photo{background:var(--teal); color:#fff;}
  .btn-manual{background:var(--card); color:var(--teal-dark); border:2px solid var(--teal);}
  main{
    max-width:640px;
    margin:0 auto;
    padding:24px 16px 0;
  }
  .section-label{
    font-family:'Caveat', cursive;
    font-size:1.5rem;
    color:var(--teal-dark);
    margin:26px 4px 12px;
    font-weight:700;
  }
  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-size:0.9rem;
  }
  .empty span{display:block; font-size:2rem; margin-bottom:8px;}
  .archive-link{
    text-align:center;
    padding:14px;
    margin-top:6px;
    color:var(--teal);
    font-size:0.8rem;
    font-weight:600;
    cursor:pointer;
    background:var(--card);
    border-radius:10px;
    box-shadow:var(--shadow);
  }
  .archive-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid rgba(0,0,0,0.08);
  }
  .archive-item-title{
    font-weight:600;
    font-size:0.92rem;
    margin:0 0 2px;
  }
  .archive-item .mini-btn{flex:none; padding:8px 14px;}
  .card{
    background:var(--card);
    border-radius:4px;
    box-shadow: var(--shadow);
    padding:16px;
    margin-bottom:16px;
    position:relative;
  }
  .card.polaroid{
    transform:rotate(var(--rot,-0.8deg));
  }
  .card::before{
    content:'';
    position:absolute;
    top:-10px;
    left:50%;
    transform:translateX(-50%) rotate(-3deg);
    width:38px;
    height:16px;
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(0,0,0,0.06);
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .card-title{
    font-weight:600;
    font-size:1.02rem;
    margin:0 0 2px;
  }
  .card-title .no-title{
    font-style:italic;
    color:var(--ink-soft);
    font-weight:500;
  }
  .card-meta{
    font-family:'JetBrains Mono', monospace;
    font-size:0.7rem;
    color:var(--ink-soft);
  }
  .badge{
    font-size:0.68rem;
    font-weight:600;
    padding:4px 10px;
    border-radius:20px;
    white-space:nowrap;
  }
  .badge.offen{background:var(--ochre-soft); color:var(--ochre);}
  .badge.erledigt{background:var(--sage-soft); color:var(--sage);}
  .photos{
    display:flex;
    gap:10px;
    margin-top:12px;
  }
  .photo-box{
    flex:1;
    text-align:center;
  }
  .photo-box img{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    border-radius:3px;
    border:1px solid rgba(0,0,0,0.08);
  }
  .photo-box .ph-label{
    font-family:'JetBrains Mono', monospace;
    font-size:0.62rem;
    color:var(--ink-soft);
    margin-top:4px;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .photo-placeholder{
    aspect-ratio:1;
    border:1.5px dashed rgba(0,0,0,0.18);
    border-radius:3px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:rgba(0,0,0,0.28);
    font-size:1.4rem;
    cursor:pointer;
    position:relative;
  }
  .photo-placeholder input{
    position:absolute; inset:0; opacity:0; cursor:pointer;
  }
  .card-actions{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .mini-btn{
    flex:1;
    border:none;
    border-radius:8px;
    padding:9px;
    font-size:0.78rem;
    font-weight:600;
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
  }
  .mini-btn.done{background:var(--teal); color:#fff;}
  .mini-btn.after{background:var(--ochre-soft); color:var(--ochre);}
  .mini-btn.edit{background:var(--sage-soft); color:var(--sage);}
  .mini-btn.del{background:transparent; color:var(--pin); border:1px solid rgba(200,90,74,0.3);}

  .overlay{
    position:fixed; inset:0;
    background:rgba(43,46,41,0.5);
    display:none;
    align-items:flex-end;
    z-index:50;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--card);
    width:100%;
    border-radius:20px 20px 0 0;
    padding:22px 20px 28px;
    max-height:85vh;
    overflow-y:auto;
  }
  .sheet h2{
    font-family:'Caveat', cursive;
    font-size:1.7rem;
    color:var(--teal-dark);
    margin:0 0 14px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:0.75rem;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .field input[type=text], .field select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1.5px solid rgba(0,0,0,0.12);
    font-family:'Work Sans', sans-serif;
    font-size:0.95rem;
    background:#fff;
  }
  .photo-input-area{
    border:2px dashed rgba(0,0,0,0.18);
    border-radius:12px;
    padding:18px;
    text-align:center;
    cursor:pointer;
    position:relative;
    overflow:hidden;
  }
  .photo-input-area img{
    width:100%;
    max-height:200px;
    object-fit:cover;
    border-radius:8px;
  }
  .photo-input-area .hint{
    color:var(--ink-soft);
    font-size:0.85rem;
  }
  .photo-input-area input{
    position:absolute; inset:0; opacity:0; cursor:pointer;
  }
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .sheet-actions .btn{flex:1; box-shadow:none;}
  .btn-cancel{background:transparent; color:var(--ink-soft); border:1.5px solid rgba(0,0,0,0.15);}
  .btn-save{background:var(--teal); color:#fff;}
  .loading{
    text-align:center;
    padding:30px;
    color:var(--ink-soft);
    font-family:'JetBrains Mono', monospace;
    font-size:0.8rem;
  }
  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--teal-dark);
    color:#fff;
    padding:10px 18px;
    border-radius:10px;
    font-size:0.85rem;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
    z-index:100;
    box-shadow:var(--shadow);
  }
  .toast.show{opacity:1;}
  .reset-link{
    display:block;
    text-align:center;
    margin-top:30px;
    color:var(--ink-soft);
    font-size:0.72rem;
    text-decoration:underline;
    cursor:pointer;
  }
</style>

<body>

<header>
  <a href="https://homedashboardachternfelde.netlify.app" class="back-link">← Zurück zum Dashboard</a>
  <h1>Die Pinnwand</h1>
  <p>Haushaltsaufgaben mit Foto festhalten</p>
  <div class="stats">
    <div class="stat"><b id="statOpen">0</b>offen</div>
    <div class="stat"><b id="statDone">0</b>erledigt</div>
  </div>
</header>

<div class="toolbar">
  <button class="btn btn-photo" id="btnPhotoTask">📷 Foto aufnehmen</button>
  <button class="btn btn-manual" id="btnManualTask">✎ Manuell eintragen</button>
</div>

<main>
  <div class="section-label">Zu erledigen</div>
  <div id="listOpen"></div>

  <div class="section-label">Erledigt</div>
  <div id="listDone"></div>
</main>

<span class="reset-link" id="resetLink">Alle Aufgaben zurücksetzen</span>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  // Firebase Setup – ersetzt window.storage 1:1, gleiche Datenbank wie das Küchen Dashboard
  const firebaseConfig = {
    apiKey: "AIzaSyBFbKIBKr0gr621e8XSljAG4lGXOSrIxwo",
    authDomain: "homedashboard-8d951.firebaseapp.com",
    projectId: "homedashboard-8d951",
    storageBucket: "homedashboard-8d951.firebasestorage.app",
    messagingSenderId: "443725141758",
    appId: "1:443725141758:web:64331ff8100f27acd037af"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const COLLECTION = 'household';

  window.storage = {
    async get(key, shared) {
      const snap = await db.collection(COLLECTION).doc(key).get();
      if (!snap.exists) return null;
      return { key, value: snap.data().value, shared: !!shared };
    },
    async set(key, value, shared) {
      await db.collection(COLLECTION).doc(key).set({ value, updatedAt: Date.now() });
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      await db.collection(COLLECTION).doc(key).delete();
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const snap = await db.collection(COLLECTION).get();
      const keys = [];
      snap.forEach((d) => {
        if (!prefix || d.id.startsWith(prefix)) keys.push(d.id);
      });
      return { keys, prefix, shared: !!shared };
    },
  };
</script>
<script>
const CATEGORIES = ["Sonstiges","Küche","Bad","Wohnzimmer","Schlafzimmer","Kinderzimmer","Büro","Flur 2. Etage","Garten"];
let tasks = [];
let photoCache = {};
let pendingPhoto = null;

const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');
const toastEl = document.getElementById('toast');

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 2200);
}

function closeSheet(){
  overlay.classList.remove('show');
  sheet.innerHTML = '';
  pendingPhoto = null;
}

function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 700;
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = h*maxDim/w; w = maxDim; }
        else if(h > maxDim){ w = w*maxDim/h; h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const ARCHIVE_DAYS = 30;

async function loadTasks(){
  document.getElementById('listOpen').innerHTML = '<div class="loading">Lade Aufgaben …</div>';
  try{
    const result = await window.storage.get('tasks', true);
    tasks = result && result.value ? JSON.parse(result.value) : [];
  }catch(err){
    tasks = [];
  }
  await migrateOldPhotos();
  await purgeOldArchive();
  await loadPhotos(tasks.map(t=>t.id));
  render();
}

async function purgeOldArchive(){
  const cutoff = Date.now() - ARCHIVE_DAYS * 24 * 60 * 60 * 1000;
  const expired = tasks.filter(t => t.status === 'erledigt' && (t.doneAt || t.createdAt) < cutoff);
  if(expired.length === 0) return;
  const expiredIds = expired.map(t=>t.id);
  tasks = tasks.filter(t => !expiredIds.includes(t.id));
  await saveTasks();
  await Promise.all(expiredIds.map(id => window.storage.delete('task-photo:'+id, true).catch(()=>{})));
}

async function migrateOldPhotos(){
  const legacy = tasks.filter(t=>t.photoBefore || t.photoAfter);
  if(legacy.length === 0) return;
  await Promise.all(legacy.map(t=>
    savePhoto(t.id, { photoBefore: t.photoBefore || null, photoAfter: t.photoAfter || null })
  ));
  tasks = tasks.map(({photoBefore, photoAfter, ...rest})=>rest);
  await saveTasks();
}

async function loadPhotos(ids){
  const results = await Promise.all(ids.map(async id=>{
    try{
      const r = await window.storage.get('task-photo:'+id, true);
      return [id, r && r.value ? JSON.parse(r.value) : null];
    }catch(err){
      return [id, null];
    }
  }));
  results.forEach(([id, val])=>{ if(val) photoCache[id] = val; });
}

async function saveTasks(){
  try{
    const result = await window.storage.set('tasks', JSON.stringify(tasks), true);
    if(!result){ showToast('Speichern fehlgeschlagen'); }
  }catch(err){
    showToast('Speichern fehlgeschlagen');
  }
}

async function savePhoto(id, photoData){
  try{
    await window.storage.set('task-photo:'+id, JSON.stringify(photoData), true);
    photoCache[id] = photoData;
  }catch(err){
    showToast('Foto speichern fehlgeschlagen');
  }
}

function render(){
  const open = tasks.filter(t=>t.status==='offen').sort((a,b)=>b.createdAt-a.createdAt);
  const doneAll = tasks.filter(t=>t.status==='erledigt').sort((a,b)=>(b.doneAt||b.createdAt)-(a.doneAt||a.createdAt));
  const done = doneAll.slice(0, 3);
  const archived = doneAll.slice(3);
  document.getElementById('statOpen').textContent = open.length;
  document.getElementById('statDone').textContent = doneAll.length;

  const openEl = document.getElementById('listOpen');
  const doneEl = document.getElementById('listDone');

  openEl.innerHTML = open.length ? open.map(cardHtml).join('') :
    '<div class="empty"><span>🧹</span>Gerade nichts zu tun. Neue Aufgabe hinzufügen?</div>';
  doneEl.innerHTML = done.length ? done.map(cardHtml).join('') :
    '<div class="empty"><span>✅</span>Noch keine Aufgabe erledigt.</div>';
  doneEl.innerHTML += archived.length
    ? `<div class="archive-link" id="archiveLink">Archiv anzeigen (${archived.length}) · löscht sich automatisch nach ${ARCHIVE_DAYS} Tagen</div>`
    : '';

  document.querySelectorAll('[data-done]').forEach(b=>b.onclick = ()=>markDone(b.dataset.done));
  document.querySelectorAll('[data-quick-input]').forEach(inp=>inp.onchange = (e)=>quickAddPhoto(inp.dataset.quickInput, e.target.files[0]));
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick = ()=>openEditTask(b.dataset.edit));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick = ()=>deleteTask(b.dataset.del));
  const archiveLinkEl = document.getElementById('archiveLink');
  if(archiveLinkEl) archiveLinkEl.onclick = ()=>openArchive(archived);
}

function openArchive(archived){
  sheet.innerHTML = `
    <h2>Archiv</h2>
    <p class="hint" style="margin:-8px 0 14px;">Erledigte Aufgaben älter als die letzten 5 · werden nach ${ARCHIVE_DAYS} Tagen automatisch gelöscht</p>
    ${archived.map(t=>{
      const date = new Date(t.doneAt || t.createdAt).toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric'});
      return `
      <div class="archive-item">
        <div>
          <p class="archive-item-title">${t.title ? escapeHtml(t.title) : '<span class="no-title">Ohne Titel</span>'}</p>
          <p class="card-meta">${t.category} · erledigt am ${date}</p>
        </div>
        <button class="mini-btn del" data-archive-del="${t.id}">Löschen</button>
      </div>`;
    }).join('')}
    <div class="sheet-actions">
      <button class="btn btn-cancel" id="closeArchive">Schließen</button>
    </div>
  `;
  overlay.classList.add('show');
  document.getElementById('closeArchive').onclick = closeSheet;
  document.querySelectorAll('[data-archive-del]').forEach(b=>b.onclick = async ()=>{
    await deleteTask(b.dataset.archiveDel);
    closeSheet();
  });
}

async function quickAddPhoto(key, file){
  if(!file) return;
  const [id, slot] = key.split(':');
  const compressed = await compressImage(file);
  const existing = photoCache[id] || {};
  const updated = {
    photoBefore: slot === 'before' ? compressed : (existing.photoBefore || null),
    photoAfter: slot === 'after' ? compressed : (existing.photoAfter || null)
  };
  await savePhoto(id, updated);
  render();
  showToast('Foto gespeichert');
}

function cardHtml(t){
  const rot = (t.id.charCodeAt(0)%2===0? 1:-1) * (0.4 + (t.id.charCodeAt(1)%5)/10);
  const date = new Date(t.createdAt).toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit'});
  const photos = photoCache[t.id] || {};
  return `
  <div class="card polaroid" style="--rot:${rot}deg">
    <div class="card-top">
      <div>
        <p class="card-title">${t.title ? escapeHtml(t.title) : '<span class="no-title">Ohne Titel</span>'}</p>
        <p class="card-meta">${t.category} · ${date}</p>
      </div>
      <span class="badge ${t.status}">${t.status}</span>
    </div>
    <div class="photos">
      <div class="photo-box">
        ${photos.photoBefore
          ? `<img src="${photos.photoBefore}">`
          : `<label class="photo-placeholder" data-quick="${t.id}:before">+<input type="file" accept="image/*" data-quick-input="${t.id}:before"></label>`}
        <div class="ph-label">Vorher</div>
      </div>
      <div class="photo-box">
        ${photos.photoAfter
          ? `<img src="${photos.photoAfter}">`
          : `<label class="photo-placeholder" data-quick="${t.id}:after">+<input type="file" accept="image/*" data-quick-input="${t.id}:after"></label>`}
        <div class="ph-label">Nachher</div>
      </div>
    </div>
    <div class="card-actions">
      ${t.status==='offen' ? `<button class="mini-btn done" data-done="${t.id}">Als erledigt markieren</button>` : ''}
      <button class="mini-btn edit" data-edit="${t.id}">Bearbeiten</button>
      <button class="mini-btn del" data-del="${t.id}">Löschen</button>
    </div>
  </div>`;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function markDone(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  t.status = 'erledigt';
  t.doneAt = Date.now();
  render();
  await saveTasks();
  showToast('Aufgabe erledigt');
}

async function deleteTask(id){
  tasks = tasks.filter(x=>x.id!==id);
  delete photoCache[id];
  render();
  await saveTasks();
  try{ await window.storage.delete('task-photo:'+id, true); }catch(err){}
  showToast('Aufgabe gelöscht');
}

function openEditTask(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  const photos = photoCache[id] || {};
  let newBefore = null, newAfter = null;
  sheet.innerHTML = `
    <h2>Aufgabe bearbeiten</h2>
    <div class="field">
      <label>Titel</label>
      <input type="text" id="editTitle" value="${escapeAttr(t.title)}">
    </div>
    <div class="field">
      <label>Bereich</label>
      <select id="editCategory">
        ${CATEGORIES.map(c=>`<option value="${c}" ${c===t.category?'selected':''}>${c}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Vorher Foto</label>
      <div class="photo-input-area" id="editBeforeArea">
        ${photos.photoBefore ? `<img src="${photos.photoBefore}">` : `<p class="hint">Tippen um ein Foto hinzuzufügen</p>`}
        <input type="file" accept="image/*" id="editBeforeInput">
      </div>
    </div>
    <div class="field">
      <label>Nachher Foto</label>
      <div class="photo-input-area" id="editAfterArea">
        ${photos.photoAfter ? `<img src="${photos.photoAfter}">` : `<p class="hint">Tippen um ein Foto hinzuzufügen</p>`}
        <input type="file" accept="image/*" id="editAfterInput">
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-cancel" id="cancelEdit">Abbrechen</button>
      <button class="btn btn-save" id="saveEdit">Speichern</button>
    </div>
  `;
  overlay.classList.add('show');

  document.getElementById('editBeforeInput').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    newBefore = await compressImage(file);
    document.getElementById('editBeforeArea').innerHTML = `<img src="${newBefore}">`;
  };
  document.getElementById('editAfterInput').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    newAfter = await compressImage(file);
    document.getElementById('editAfterArea').innerHTML = `<img src="${newAfter}">`;
  };

  document.getElementById('cancelEdit').onclick = closeSheet;
  document.getElementById('saveEdit').onclick = async ()=>{
    const title = document.getElementById('editTitle').value.trim();
    t.title = title;
    t.category = document.getElementById('editCategory').value;
    closeSheet();
    render();
    await saveTasks();
    if(newBefore || newAfter){
      await savePhoto(id, {
        photoBefore: newBefore || photos.photoBefore || null,
        photoAfter: newAfter || photos.photoAfter || null
      });
      render();
    }
    showToast('Aufgabe aktualisiert');
  };
}

function escapeAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}

function openTaskForm(withPhoto){
  let pendingAfter = null;
  sheet.innerHTML = `
    <h2>${withPhoto ? 'Aufgabe mit Foto' : 'Neue Aufgabe'}</h2>
    ${withPhoto ? `
    <div class="field">
      <label>Vorher Foto</label>
      <div class="photo-input-area" id="photoArea">
        <p class="hint">Tippen um ein Foto aufzunehmen</p>
        <input type="file" accept="image/*" id="photoInput">
      </div>
    </div>
    <div class="field">
      <label>Nachher Foto (optional)</label>
      <div class="photo-input-area" id="photoAfterArea">
        <p class="hint">Tippen um ein Foto aufzunehmen</p>
        <input type="file" accept="image/*" id="photoAfterInput">
      </div>
    </div>` : ''}
    <div class="field">
      <label>Titel (optional)</label>
      <input type="text" id="taskTitle" placeholder="z. B. Geschirrspüler ausräumen">
    </div>
    <div class="field">
      <label>Bereich</label>
      <select id="taskCategory">
        ${CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}
      </select>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-cancel" id="cancelTask">Abbrechen</button>
      <button class="btn btn-save" id="saveTask">Aufgabe anlegen</button>
    </div>
  `;
  overlay.classList.add('show');

  if(withPhoto){
    document.getElementById('photoInput').onchange = async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      pendingPhoto = await compressImage(file);
      document.getElementById('photoArea').innerHTML = `<img src="${pendingPhoto}">`;
    };
    document.getElementById('photoAfterInput').onchange = async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      pendingAfter = await compressImage(file);
      document.getElementById('photoAfterArea').innerHTML = `<img src="${pendingAfter}">`;
    };
  }

  document.getElementById('cancelTask').onclick = closeSheet;
  document.getElementById('saveTask').onclick = async ()=>{
    const title = document.getElementById('taskTitle').value.trim();
    const category = document.getElementById('taskCategory').value;
    const newTask = {
      id: 't' + Date.now() + Math.random().toString(36).slice(2,7),
      title, category,
      status: 'offen',
      createdAt: Date.now()
    };
    tasks.push(newTask);
    if(pendingPhoto || pendingAfter){
      await savePhoto(newTask.id, { photoBefore: pendingPhoto || null, photoAfter: pendingAfter || null });
    }
    closeSheet();
    render();
    await saveTasks();
    showToast('Aufgabe angelegt');
  };
}

document.getElementById('btnPhotoTask').onclick = ()=>openTaskForm(true);
document.getElementById('btnManualTask').onclick = ()=>openTaskForm(false);
overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(); };

document.getElementById('resetLink').onclick = async ()=>{
  if(!confirm('Wirklich alle Aufgaben löschen?')) return;
  const ids = tasks.map(t=>t.id);
  tasks = [];
  photoCache = {};
  render();
  await saveTasks();
  await Promise.all(ids.map(id=>window.storage.delete('task-photo:'+id, true).catch(()=>{})));
  showToast('Zurückgesetzt');
};

loadTasks();
</script>
</body>
</html>
